# Project-wide Gradle settings for optimized builds

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Increase memory for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle parallel execution
org.gradle.parallel=true

# Enable Gradle caching
org.gradle.caching=true

# Configure build cache
org.gradle.configureondemand=false

# Increase workers for parallel builds
org.gradle.workers.max=4

# Enable R8 full mode for better optimization
android.enableR8.fullMode=true

# Disable unused features for faster builds
android.enableBuildCache=true
android.enableD8.desugaring=true

# Network timeout settings
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000

# Kotlin optimization (if using Kotlin)
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.caching.enabled=true

# Disable unnecessary warnings
android.suppressUnsupportedCompileSdk=34

# React Native specific
FLIPPER_VERSION=0.182.0
hermesEnabled=true

# Build optimization
org.gradle.daemon=false

