// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    // Explicitly set Kotlin version to match KSP requirements
    // KSP requires Kotlin 2.0+ for compatibility with Expo SDK 54 and React Native 0.76
    kotlinVersion = '2.0.21'
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Apply comprehensive expo compatibility fixes
apply from: file("gradle/expo-compatibility.gradle")
apply from: file("gradle/expo-localization-patch.gradle")
