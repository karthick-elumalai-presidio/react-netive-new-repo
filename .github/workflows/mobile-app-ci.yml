name: Mobile App CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Lint (Develop)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Bun for dependency installation to avoid npm/yarn lockfile cache requirement
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment Info
        run: |
          echo "Node: $(node -v)"
          echo "Bun: $(bun -v)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Current directory contents:"
          ls -la

      - name: Lint
        run: |
          bun run lint || true

      # Prebuild for Expo
      - name: Prebuild Project
        run: |
          echo "Running expo prebuild for native projects"
          bun run prebuild --clean
          echo "Checking created directories:"
          ls -la
          if [ -d "android" ]; then
            echo "Android directory created:"
            ls -la android/
          fi
          if [ -d "ios" ]; then
            echo "iOS directory created:"
            ls -la ios/
          fi

      # Setup Fastlane after prebuild
      - name: Setup Fastlane Configuration
        run: |
          echo "Setting up Fastlane configuration..."
          echo "Current directory: $(pwd)"
          echo "Contents before setup:"
          ls -la
          echo "Android directory status:"
          ls -la android/ || echo "Android directory does not exist"
          
          # Ensure android directory exists
          if [ ! -d "android" ]; then
            echo "Creating android directory..."
            mkdir -p android
          fi
          
          # Always create/recreate Android Gemfile to ensure it exists
          echo "Creating Android Gemfile..."
          echo 'source "https://rubygems.org"' > android/Gemfile
          echo '' >> android/Gemfile
          echo 'gem "fastlane"' >> android/Gemfile
          echo '' >> android/Gemfile
          echo 'plugins_path = File.join(File.dirname(__FILE__), '\''fastlane'\'', '\''Pluginfile'\'')' >> android/Gemfile
          echo 'eval_gemfile(plugins_path) if File.exist?(plugins_path)' >> android/Gemfile
          echo "Android Gemfile created:"
          cat android/Gemfile
          
          # Create Android Fastfile if it doesn't exist
          if [ ! -d "android/fastlane" ]; then
            mkdir -p android/fastlane
          fi
          
          if [ ! -f "android/fastlane/Fastfile" ]; then
            echo "Creating Android Fastfile..."
            echo 'default_platform(:android)' > android/fastlane/Fastfile
            echo '' >> android/fastlane/Fastfile
            echo 'platform :android do' >> android/fastlane/Fastfile
            echo '  desc "Build debug APK"' >> android/fastlane/Fastfile
            echo '  lane :build_debug do' >> android/fastlane/Fastfile
            echo '    gradle(' >> android/fastlane/Fastfile
            echo '      task: "assembleDebug",' >> android/fastlane/Fastfile
            echo '      project_dir: "."' >> android/fastlane/Fastfile
            echo '    )' >> android/fastlane/Fastfile
            echo '  end' >> android/fastlane/Fastfile
            echo 'end' >> android/fastlane/Fastfile
          fi
          
          # Ensure ios directory exists
          if [ ! -d "ios" ]; then
            echo "Creating ios directory..."
            mkdir -p ios
          fi
          
          # Always create/recreate iOS Gemfile to ensure it exists
          echo "Creating iOS Gemfile..."
          echo 'source "https://rubygems.org"' > ios/Gemfile
          echo '' >> ios/Gemfile
          echo 'gem "fastlane"' >> ios/Gemfile
          echo '' >> ios/Gemfile
          echo 'plugins_path = File.join(File.dirname(__FILE__), '\''fastlane'\'', '\''Pluginfile'\'')' >> ios/Gemfile
          echo 'eval_gemfile(plugins_path) if File.exist?(plugins_path)' >> ios/Gemfile
          echo "iOS Gemfile created:"
          cat ios/Gemfile
          
          # Create iOS Fastfile if it doesn't exist
          if [ ! -d "ios/fastlane" ]; then
            mkdir -p ios/fastlane
          fi
          
          if [ ! -f "ios/fastlane/Fastfile" ]; then
            echo "Creating iOS Fastfile..."
            echo 'default_platform(:ios)' > ios/fastlane/Fastfile
            echo '' >> ios/fastlane/Fastfile
            echo 'platform :ios do' >> ios/fastlane/Fastfile
            echo '  desc "Build debug version"' >> ios/fastlane/Fastfile
            echo '  lane :build_debug do' >> ios/fastlane/Fastfile
            echo '    build_app(' >> ios/fastlane/Fastfile
            echo '      scheme: "CbM_mobile_app",' >> ios/fastlane/Fastfile
            echo '      configuration: "Debug",' >> ios/fastlane/Fastfile
            echo '      export_method: "development"' >> ios/fastlane/Fastfile
            echo '    )' >> ios/fastlane/Fastfile
            echo '  end' >> ios/fastlane/Fastfile
            echo 'end' >> ios/fastlane/Fastfile
          fi
          
          echo "Final Fastlane setup verification:"
          echo "Android directory contents:"
          ls -la android/ || echo "No android directory"
          echo "Android Gemfile contents:"
          cat android/Gemfile || echo "No Android Gemfile"
          echo "Android fastlane directory:"
          ls -la android/fastlane/ || echo "No android fastlane directory"
          
          echo "iOS directory contents:"
          ls -la ios/ || echo "No ios directory"
          echo "iOS Gemfile contents:"
          cat ios/Gemfile || echo "No iOS Gemfile"
          echo "iOS fastlane directory:"
          ls -la ios/fastlane/ || echo "No ios fastlane directory"

      # Android Build Setup
      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby for Android
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './android'

      - name: Android Fastlane Build
        run: |
          cd android
          echo "Checking Gemfile and Fastlane files:"
          ls -la Gemfile
          ls -la fastlane/
          echo "Running Fastlane build..."
          bundle exec fastlane build_debug

      # iOS Build Setup
      - name: Setup Ruby for iOS
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './ios'

      - name: iOS Fastlane Build
        run: |
          cd ios
          echo "Checking Gemfile and Fastlane files:"
          ls -la Gemfile
          ls -la fastlane/
          echo "Running Fastlane build..."
          bundle exec fastlane build_debug

      # Upload Build Artifacts
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-build
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios/build/
          retention-days: 7

      - name: Build Success Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Development build completed successfully!"
            echo "📦 Build artifacts available for download"
            echo "🔗 Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "⚠️ Development build had issues"
            echo "🔍 Check logs for more details"
          fi