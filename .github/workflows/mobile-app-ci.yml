name: Mobile App CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Lint (Develop)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Bun for dependency installation to avoid npm/yarn lockfile cache requirement
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment Info
        run: |
          echo "Node: $(node -v)"
          echo "Bun: $(bun -v)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Current directory contents:"
          ls -la

      - name: Lint
        run: |
          bun run lint || true

      # Prebuild for Expo
      - name: Prebuild Project
        run: |
          echo "Running expo prebuild for native projects"
          bun run prebuild --clean
          echo "Checking created directories:"
          ls -la
          if [ -d "android" ]; then
            echo "Android directory created:"
            ls -la android/
          fi
          if [ -d "ios" ]; then
            echo "iOS directory created:"
            ls -la ios/
          fi

      # Android Build Setup
      - name: Setup Java for Android
        if: hashFiles('android/Gemfile') != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby for Android
        if: hashFiles('android/Gemfile') != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './android'

      - name: Android Fastlane Build
        if: hashFiles('android/Gemfile') != ''
        run: |
          cd android
          echo "Installing Ruby gems..."
          bundle install
          echo "Running Fastlane build..."
          bundle exec fastlane build_debug

      # iOS Build Setup
      - name: Setup Ruby for iOS
        if: hashFiles('ios/Gemfile') != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './ios'

      - name: iOS Fastlane Build
        if: hashFiles('ios/Gemfile') != ''
        run: |
          cd ios
          echo "Installing Ruby gems..."
          bundle install
          echo "Running Fastlane build..."
          bundle exec fastlane build_debug

      # Upload Build Artifacts
      - name: Upload Android Artifacts
        if: hashFiles('android/Gemfile') != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-build
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload iOS Artifacts
        if: hashFiles('ios/Gemfile') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios/build/
          retention-days: 7

      - name: Build Success Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Development build completed successfully!"
            echo "📦 Build artifacts available for download"
            echo "🔗 Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "⚠️ Development build had issues"
            echo "🔍 Check logs for more details"
          fi