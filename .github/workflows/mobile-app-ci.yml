name: Mobile App CI (PR Validation)

on:
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

env:
  NODE_VERSION: 18

jobs:
  pr-validate:
    name: PR Validate (iOS-first)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment Info
        run: |
          echo "Node: $(node -v)"
          echo "Bun: $(bun -v)"
          echo "Branch: ${{ github.ref_name }}"
          ls -la

      - name: Lint
        run: |
          bun run lint || true

      - name: Prebuild Project
        run: |
          if [ ! -d "ios" ] || [ ! -d "android" ]; then
            echo "Native folders missing; running prebuild"
            bun run prebuild
          else
            echo "Native folders present; skipping prebuild"
          fi
          ls -la

      - name: Setup Ruby for iOS
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './ios'

      - name: iOS Fastlane Build
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: |
          cd ios
          bundle install || true
          bundle exec fastlane match_development
          bundle exec fastlane build_debug

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ios/build/
          retention-days: 7