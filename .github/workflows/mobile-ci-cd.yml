name: Mobile App CI/CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - qa
          - production

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.1.34'

jobs:
  validate:
    name: Validate (Lint, Typecheck, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ''

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit

      # If you add tests later, enable this
      # - name: Test
      #   run: bun test

  build_android:
    name: Build Android Artifact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ''

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Backup Fastlane config
        run: |
          mkdir -p /tmp/android-fastlane-backup
          cp -r android/fastlane /tmp/android-fastlane-backup/ || true
          cp android/Gemfile /tmp/android-fastlane-backup/ || true
          cp android/Gemfile.lock /tmp/android-fastlane-backup/ || true

      - name: Expo prebuild (generate Android native project)
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Running expo prebuild for Android..."
            bun run prebuild --platform android --clean
          else
            echo "Android gradle wrapper exists, skipping prebuild"
          fi

      - name: Restore Fastlane config
        run: |
          if [ -d "/tmp/android-fastlane-backup/fastlane" ]; then
            echo "Restoring custom Fastlane configuration..."
            cp -r /tmp/android-fastlane-backup/fastlane android/
            cp /tmp/android-fastlane-backup/Gemfile android/ || true
            cp /tmp/android-fastlane-backup/Gemfile.lock android/ || true
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Fastlane deps (Android)
        working-directory: android
        run: |
          if [ -f Gemfile ]; then
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs 4 --retry 3
          else
            echo "No Gemfile found; installing fastlane gem globally"
            gem install fastlane --no-document
          fi

      - name: Build Android release (AAB/APK)
        working-directory: android
        env:
          CI: true
          FASTLANE_SKIP_UPDATE_CHECK: true
          FASTLANE_DISABLE_COLORS: true
          FASTLANE_OPT_OUT_USAGE: true
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          echo "PWD: $(pwd)" && ls -la && echo "--- fastlane dir ---" && ls -la fastlane || true
          echo "🚀 Optimizing Gradle build with parallel execution..."
          if [ -f Gemfile ]; then
            echo "Running fastlane with bundler"
            bundle exec fastlane --version || true
            bundle exec fastlane build_release || fastlane build_release
          else
            echo "No Gemfile detected; running fastlane directly"
            fastlane --version || true
            fastlane build_release
          fi

      - name: Android build failure summary
        if: failure()
        run: |
          echo "Android build failed. See logs above."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

  build_ios:
    name: Build iOS Artifact
    runs-on: macos-14
    needs: validate
    env:
      HAS_IOS_SIGNING: ${{ secrets.APPLE_TEAM_ID != '' && secrets.MATCH_GIT_URL != '' && secrets.MATCH_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ''

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Backup Fastlane config (iOS)
        run: |
          mkdir -p /tmp/ios-fastlane-backup
          cp -r ios/fastlane /tmp/ios-fastlane-backup/ || true
          cp ios/Gemfile /tmp/ios-fastlane-backup/ || true
          cp ios/Gemfile.lock /tmp/ios-fastlane-backup/ || true

      - name: Expo prebuild (generate iOS native project)
        run: |
          if [ ! -d "ios/CbMmobileapp.xcworkspace" ]; then
            echo "Running expo prebuild for iOS..."
            bun run prebuild --platform ios --clean
          else
            echo "iOS workspace exists, skipping prebuild"
          fi

      - name: Restore Fastlane config (iOS)
        run: |
          if [ -d "/tmp/ios-fastlane-backup/fastlane" ]; then
            echo "Restoring custom Fastlane configuration..."
            cp -r /tmp/ios-fastlane-backup/fastlane ios/
            cp /tmp/ios-fastlane-backup/Gemfile ios/ || true
            cp /tmp/ios-fastlane-backup/Gemfile.lock ios/ || true
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane deps (iOS)
        working-directory: ios
        run: |
          if [ -f Gemfile ]; then
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs 4 --retry 3
          else
            echo "No Gemfile found; installing fastlane gem globally"
            gem install fastlane --no-document
          fi

      - name: Build iOS App Store IPA
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        working-directory: ios
        continue-on-error: true
        timeout-minutes: 20
        env:
          CI: true
          FASTLANE_SKIP_UPDATE_CHECK: true
          FASTLANE_DISABLE_COLORS: true
          FASTLANE_OPT_OUT_USAGE: true
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
          FASTLANE_XCODE_LIST_TIMEOUT: 180
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "PWD: $(pwd)" && ls -la && echo "--- fastlane dir ---" && ls -la fastlane || true
          echo "⚠️  Note: iOS build requires valid SSH access to Match certificates repository"
          echo "⚠️  If Match fails, the build will be skipped (not a failure)"
          echo "🚀 Optimizing iOS build with faster settings..."
          if [ -f Gemfile ]; then
            echo "Running fastlane with bundler (iOS)"
            bundle exec fastlane build_appstore_ipa || echo "iOS build skipped due to signing issues"
          else
            echo "No Gemfile detected; running fastlane directly (iOS)"
            fastlane build_appstore_ipa || echo "iOS build skipped due to signing issues"
          fi

      - name: iOS build status
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          if [ -f "ios/build/ios/release.ipa" ]; then
            echo "✅ iOS build successful - IPA created"
          else
            echo "⚠️  iOS build was skipped (likely due to signing configuration)"
            echo "This is not a failure - it means certificates couldn't be synced"
            echo "To enable iOS builds, you need to:"
            echo "  1. Configure SSH deploy key for Match repository in GitHub Actions"
            echo "  2. OR use HTTPS with personal access token"
            echo "  3. OR use App Store Connect API key authentication"
          fi

      - name: Skip iOS build (missing signing secrets)
        if: ${{ env.HAS_IOS_SIGNING != 'true' }}
        run: |
          echo "⚠️  Skipping iOS build: required signing secrets not configured"
          echo "iOS builds require: MATCH_GIT_URL, MATCH_PASSWORD, APPLE_ID, APPLE_TEAM_ID"

      - name: Upload artifacts
        if: ${{ env.HAS_IOS_SIGNING == 'true' && hashFiles('ios/build/ios/*.ipa') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/build/ios/*.ipa
          if-no-files-found: warn

  # Explicit approval gates for each environment
  approve_development:
    name: Manual Approval (Development)
    runs-on: ubuntu-latest
    needs: [build_android]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'development' }}
    environment:
      name: development
    steps:
      - run: echo " Development deployment approved"

  approve_qa:
    name: Manual Approval (QA)
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'qa' }}
    environment:
      name: qa
    steps:
      - run: echo " QA deployment approved"

  approve_production:
    name: Manual Approval (Production)
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    environment:
      name: production
    steps:
      - run: echo " Production deployment approved"

  # Deploy jobs are environment-scoped. They only consume artifacts and do not rebuild.
  deploy_development:
    name: Deploy to Development
    runs-on: macos-14
    needs: [approve_development]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'development' }}
    environment:
      name: development
    env:
      CI: true
      FASTLANE_SKIP_UPDATE_CHECK: true
      FASTLANE_DISABLE_COLORS: true
      FASTLANE_OPT_OUT_USAGE: true
      HAS_IOS_SIGNING: ${{ secrets.APPLE_TEAM_ID != '' && secrets.MATCH_GIT_URL != '' && secrets.MATCH_PASSWORD != '' }}
    steps:
      - name: Stop if any build failed
        if: ${{ needs.build_android.result == 'failure' || (needs.build_ios && needs.build_ios.result == 'failure') }}
        run: |
          echo "Aborting deploy: a build job failed."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Deploy Android to Internal track
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle install --path vendor/bundle
          # Use the already built artifacts
          bundle exec fastlane deploy_beta

      # Optional iOS upload to TestFlight Internal for development
      - name: Download iOS artifacts
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - name: Setup Ruby (iOS)
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Upload iOS IPA to TestFlight (Development)
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          if [ -f Gemfile ]; then
            bundle config set --local path 'vendor/bundle'
            bundle install --jobs 4 --retry 3
            bundle exec fastlane upload_testflight_ipa ipa:../ios-artifacts/release.ipa || bundle exec fastlane upload_testflight_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)
          else
            gem install fastlane --no-document
            fastlane upload_testflight_ipa ipa:../ios-artifacts/release.ipa || fastlane upload_testflight_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)
          fi

  deploy_qa:
    name: Deploy to QA
    runs-on: macos-14
    needs: [approve_qa]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'qa' }}
    environment:
      name: qa
    steps:
      - name: Stop if any build failed
        if: ${{ needs.build_android.result == 'failure' || needs.build_ios.result == 'failure' }}
        run: |
          echo "Aborting QA deploy: a build job failed."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - name: Setup Ruby (Android)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Deploy Android to Internal track
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane deploy_beta

      - name: Setup Ruby (iOS)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Upload iOS IPA to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane upload_testflight_ipa ipa:../ios-artifacts/release.ipa || bundle exec fastlane upload_testflight_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)

  deploy_production:
    name: Deploy to Production
    runs-on: macos-14
    needs: [approve_production]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    environment:
      name: production
    steps:
      - name: Stop if any build failed
        if: ${{ needs.build_android.result == 'failure' || needs.build_ios.result == 'failure' }}
        run: |
          echo "Aborting production deploy: a build job failed."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - name: Setup Ruby (Android)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Deploy Android to Production
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane deploy_production

      - name: Setup Ruby (iOS)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Upload iOS IPA to App Store
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane upload_appstore_ipa ipa:../ios-artifacts/release.ipa || bundle exec fastlane upload_appstore_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)
