name: Mobile App CI/CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - qa
          - production

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.1.34'

jobs:
  # ==========================
  # VALIDATION STAGE
  # ==========================
  validate:
    name: Validate (Lint, Typecheck, Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit

  # ==========================
  # ANDROID BUILD STAGE
  # ==========================
  build_android:
    name: Build Android Artifact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      - run: bun install --frozen-lockfile || bun install

      - name: Backup Fastlane
        run: |
          mkdir -p /tmp/android-fastlane
          cp -r android/fastlane /tmp/android-fastlane/ || true
          cp android/Gemfile* /tmp/android-fastlane/ || true

      - name: Expo Prebuild (Android)
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Running expo prebuild..."
            bun run prebuild --platform android --clean
          fi

      - name: Restore Fastlane
        run: cp -r /tmp/android-fastlane/* android/ || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build Android (Release)
        working-directory: android
        env:
          CI: true
          FASTLANE_SKIP_UPDATE_CHECK: true
        run: |
          bundle exec fastlane build_release || fastlane build_release

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android/app/build/outputs/**/release/*.{aab,apk}
          retention-days: 5

  # ==========================
  # iOS BUILD STAGE
  # ==========================
  build_ios:
    name: Build iOS Artifact
    runs-on: macos-14
    needs: validate
    env:
      HAS_IOS_SIGNING: ${{ secrets.APPLE_TEAM_ID && secrets.MATCH_GIT_URL && secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      - run: bun install --frozen-lockfile || bun install

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: Backup Fastlane
        run: |
          mkdir -p /tmp/ios-fastlane
          cp -r ios/fastlane /tmp/ios-fastlane/ || true
          cp ios/Gemfile* /tmp/ios-fastlane/ || true

      - name: Expo Prebuild (iOS)
        run: |
          if [ ! -d "ios/*.xcworkspace" ]; then
            bun run prebuild --platform ios --clean
          fi

      - name: Restore Fastlane
        run: cp -r /tmp/ios-fastlane/* ios/ || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Build iOS IPA
        if: ${{ env.HAS_IOS_SIGNING }}
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bundle exec fastlane build_appstore_ipa || echo "Skipped due to signing issues"

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_IOS_SIGNING }}
        with:
          name: ios-build
          path: ios/build/ios/*.ipa
          retention-days: 5

  # ==========================
  # APPROVAL GATES
  # ==========================
  approve_development:
    name: Manual Approval (Development)
    runs-on: ubuntu-latest
    needs: [build_android]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'development' }}
    environment: development
    steps:
      - run: echo "Development approved"

  approve_qa:
    name: Manual Approval (QA)
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'qa' }}
    environment: qa
    steps:
      - run: echo "QA approved"

  approve_production:
    name: Manual Approval (Production)
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    environment: production
    steps:
      - run: echo "Production approved"

  # ==========================
  # DEPLOYMENT JOBS
  # ==========================

  deploy_development:
    name: Deploy to Development
    runs-on: macos-14
    needs: [approve_development]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'development' }}
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Deploy Android (Internal Track)
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane deploy_beta

      - uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Upload iOS IPA (Development)
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane upload_testflight_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)

  deploy_qa:
    name: Deploy to QA
    runs-on: macos-14
    needs: [approve_qa]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'qa' }}
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Deploy Android (QA Beta)
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane deploy_beta

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Upload iOS IPA (QA TestFlight)
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane upload_testflight_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)

  deploy_production:
    name: Deploy to Production
    runs-on: macos-14
    needs: [approve_production]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Deploy Android (Production)
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane deploy_production

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Upload iOS IPA (App Store)
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          bundle install --path vendor/bundle
          bundle exec fastlane upload_appstore_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)
