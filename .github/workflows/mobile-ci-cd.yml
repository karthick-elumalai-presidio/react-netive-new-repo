name: Mobile App CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  NODE_VERSION: 20
  BUN_VERSION: 1.1.34

jobs:
  validate:
    name: Validate (Lint, Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun x tsc --noEmit

  build_android:
    name: Build Android Artifact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Expo Prebuild (Android)
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "🛠️ Running expo prebuild..."
            expo prebuild --platform android --clean
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane dependencies
        working-directory: android
        run: |
          echo "📂 Current Directory: $(pwd)"
          ls -la
          bundle config set --local frozen false
          bundle install

      - name: Build Android release (AAB/APK)
        working-directory: android
        run: |
          echo "🚀 Building Android release..."
          bundle exec fastlane build_release

  build_ios:
    name: Build iOS Artifact
    runs-on: macos-14
    needs: validate
    env:
      HAS_IOS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Expo Prebuild (iOS)
        run: |
          if [ ! -d "ios/CbMmobileapp.xcodeproj" ]; then
            echo "🛠️ Running expo prebuild..."
            expo prebuild --platform ios --clean
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane dependencies
        working-directory: ios
        run: |
          echo "📂 Current Directory: $(pwd)"
          ls -la
          bundle config set --local frozen false
          bundle install

      - name: Build iOS App Store IPA
        if: ${{ env.HAS_IOS_API_KEY == 'true' }}
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          echo "🚀 Building iOS App Store IPA..."
          bundle exec fastlane build_appstore_ipa
