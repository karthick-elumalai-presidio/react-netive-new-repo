name: Mobile App CI/CD

on:
  push:
    branches:
      - main
      - qa
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - qa
          - production
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - ios
          - android
          - all

permissions:
  id-token: write
  contents: read
  actions: read

env:
  NODE_VERSION: 18
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
  GOOGLE_PLAY_JSON_KEY_PATH: ${{ secrets.GOOGLE_PLAY_JSON_KEY_PATH }}
  APP_ENV: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'qa' && 'qa' || 'development' }}

# -------------------- DEVELOPMENT -------------------- #
jobs:
  deploy-dev:
    name: Build & Deploy (Development)
    if: github.ref_name == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'development')
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment Info
        run: |
          echo "Bun version: $(bun --version)"
          echo "Node version: $(node --version)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: Development"
          echo "Platform: ${{ inputs.platform || 'all' }}"

      # Prebuild for Expo
      - name: Prebuild Project
        run: |
          bun run prebuild --clean

      # Android Build
      - name: Setup Java for Android
        if: inputs.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby for Android
        if: inputs.platform == 'android'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './android'

      # - name: Android Build

      #   run: |
      #     cd android
      #     bundle install
      #     bundle exec fastlane build_debug

      - name: Upload Android Artifacts
        if: inputs.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-build
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # iOS Build (Development)
      - name: Setup Ruby for iOS
        if: inputs.platform == 'ios' || inputs.platform == 'all' || inputs.platform == null
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './ios'

      - name: iOS Build (Development)
        if: inputs.platform == 'ios' || inputs.platform == 'all' || inputs.platform == null
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane match_development
          bundle exec fastlane build_debug

      - name: Upload iOS Artifacts
        if: inputs.platform == 'ios' || inputs.platform == 'all' || inputs.platform == null
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-build
          path: ios/build/
          retention-days: 7

      # Notify Build Status
      - name: Notify Development Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Development build completed successfully!"
            echo "📦 Build artifacts available for download"
            echo "🌍 Environment: Development"
            echo "🔗 Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "⚠️ Development build had issues"
            echo "🔍 Check logs for more details"
          fi

# -------------------- QA -------------------- #
  deploy-qa:
    name: Build & Deploy (QA)
    if: github.ref_name == 'qa' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'qa')
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment Info
        run: |
          echo "Bun version: $(bun --version)"
          echo "Node version: $(node --version)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: QA"
          echo "Platform: ${{ inputs.platform || 'all' }}"

      # Prebuild for Expo
      - name: Prebuild Project
        run: |
          bun run prebuild --clean

      # Android Build
      - name: Setup Java for Android
        if: inputs.platform == 'android' || inputs.platform == 'all' || inputs.platform == null
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby for Android
        if: inputs.platform == 'android' || inputs.platform == 'all' || inputs.platform == null
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './android'

      - name: Android Build & Deploy
        if: inputs.platform == 'android' || inputs.platform == 'all' || inputs.platform == null
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ secrets.GOOGLE_PLAY_JSON_KEY_PATH }}
        run: |
          cd android
          bundle install
          bundle exec fastlane build_release
          bundle exec fastlane deploy_beta

      # iOS Build
      - name: Setup Ruby for iOS
        if: inputs.platform == 'ios' || inputs.platform == 'all' || inputs.platform == null
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './ios'

      - name: iOS Build & Deploy
        if: inputs.platform == 'ios' || inputs.platform == 'all' || inputs.platform == null
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane match_appstore
          bundle exec fastlane deploy_testflight

      # Upload Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-build-artifacts
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            ios/build/
          retention-days: 14

      # Notify Build Status
      - name: Notify QA Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ QA build completed successfully!"
            echo "📦 Build artifacts available for download"
            echo "🌍 Environment: QA"
            echo "🔗 Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "⚠️ QA build had issues"
            echo "🔍 Check logs for more details"
          fi

# -------------------- PRODUCTION -------------------- #
  approval-prod:
    name: Manual Approval (Production)
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Production deployment approved."

  deploy-prod:
    name: Build & Deploy (Production)
    needs: approval-prod
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment Info
        run: |
          echo "Bun version: $(bun --version)"
          echo "Node version: $(node --version)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: Production"
          echo "Platform: ${{ inputs.platform || 'all' }}"

      # Prebuild for Expo
      - name: Prebuild Project
        run: |
          bun run prebuild --clean

      # Android Build
      - name: Setup Java for Android
        if: inputs.platform == 'android' || inputs.platform == 'all' || inputs.platform == null
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby for Android
        if: inputs.platform == 'android' || inputs.platform == 'all' || inputs.platform == null
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './android'

      - name: Android Build & Deploy
        if: inputs.platform == 'android' || inputs.platform == 'all' || inputs.platform == null
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ secrets.GOOGLE_PLAY_JSON_KEY_PATH }}
        run: |
          cd android
          bundle install
          bundle exec fastlane build_release
          bundle exec fastlane deploy_production

      # iOS Build
      - name: Setup Ruby for iOS
        if: inputs.platform == 'ios' || inputs.platform == 'all' || inputs.platform == null
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './ios'

      - name: iOS Build & Deploy
        if: inputs.platform == 'ios' || inputs.platform == 'all' || inputs.platform == null
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane match_appstore
          bundle exec fastlane deploy_appstore

      # Upload Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-artifacts
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            ios/build/
          retention-days: 30

      # Notify Build Status
      - name: Notify Production Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production build completed successfully!"
            echo "📦 Build artifacts available for download"
            echo "🌍 Environment: Production"
            echo "🔗 Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "⚠️ Production build had issues"
            echo "🔍 Check logs for more details"
          fi